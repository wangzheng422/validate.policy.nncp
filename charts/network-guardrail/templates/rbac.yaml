# AI-Author: Codex (OpenAI model not exposed by runtime)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-guardrail-controller
  labels:
    {{- include "network-guardrail.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [nmstate.io]
    resources: [nodenetworkstates]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    verbs: [get, list, watch]
  - apiGroups: [guardrail.openshift.io]
    resources: [networkguardrailparameters, networkguardrailevents]
    verbs: [get, list, watch]
  - apiGroups: [guardrail.openshift.io]
    resources: [primarynetworkinventories]
    verbs: [create]
  - apiGroups: [guardrail.openshift.io]
    resources: [primarynetworkinventories, primarynetworkinventories/status]
    resourceNames: [cluster]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-guardrail-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: network-guardrail-controller
subjects:
  - kind: ServiceAccount
    name: network-guardrail-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: network-guardrail-controller
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [network-guardrail-candidate]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: network-guardrail-controller
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: network-guardrail-controller
subjects:
  - kind: ServiceAccount
    name: network-guardrail-controller
    namespace: {{ .Release.Namespace }}
